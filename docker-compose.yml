version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: taskpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskpulse-backend
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/taskpulse
      JWT_SECRET: taskpulse_jwt_secret_prod_key
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskpulse-worker
    restart: always
    command: npm run worker
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/taskpulse
      WORKER_CONCURRENCY: 10
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskpulse-frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
